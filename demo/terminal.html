<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Regression gate — terminal</title>
    <style>
      :root {
        --bg: #0b1020;
        --chrome: #161c2e;
        --fg: #e6eaf2;
        --dim: #7b8498;
        --green: #4ade80;
        --red: #f87171;
        --amber: #fbbf24;
        --cyan: #5eead4;
      }
      * { box-sizing: border-box; }
      html, body { margin: 0; height: 100%; background: #070a14; }
      body {
        font-family: ui-sans-serif, -apple-system, "Segoe UI", sans-serif;
        display: flex; align-items: stretch; justify-content: center;
        padding: 28px 28px 132px;
      }
      .window {
        width: 100%; display: flex; flex-direction: column;
        background: var(--bg); border-radius: 12px; overflow: hidden;
        box-shadow: 0 24px 70px rgba(0, 0, 0, .6); border: 1px solid #1f2740;
      }
      .titlebar {
        flex: 0 0 auto; display: flex; align-items: center; gap: 8px;
        padding: 11px 16px; background: var(--chrome); border-bottom: 1px solid #1f2740;
      }
      .dot { width: 12px; height: 12px; border-radius: 50%; }
      .title {
        flex: 1; text-align: center; color: var(--dim);
        font-size: 12.5px; letter-spacing: .02em; margin-right: 52px;
      }
      .screen {
        flex: 1; overflow: hidden; padding: 18px 22px;
        font-family: ui-monospace, "SF Mono", Menlo, monospace;
        font-size: 15px; line-height: 1.52; color: var(--fg);
        white-space: pre-wrap; word-break: break-word;
      }
      .cmd { color: #fff; font-weight: 600; }
      .prompt { color: var(--cyan); font-weight: 700; }
      .dir { color: #818cf8; }
      .ok { color: var(--green); font-weight: 600; }
      .bad { color: var(--red); font-weight: 600; }
      .warn { color: var(--amber); }
      .muted { color: var(--dim); }
      .rule { color: #2c3754; }
      .cursor {
        display: inline-block; width: 9px; height: 17px; vertical-align: -3px;
        background: var(--cyan); animation: blink 1s steps(1) infinite;
      }
      @keyframes blink { 50% { opacity: 0; } }
    </style>
  </head>
  <body>
    <div class="window">
      <div class="titlebar">
        <span class="dot" style="background:#ff5f57"></span>
        <span class="dot" style="background:#febc2e"></span>
        <span class="dot" style="background:#28c840"></span>
        <span class="title">zsh — chemical-chain-of-custody</span>
      </div>
      <div class="screen" id="screen"></div>
    </div>

    <script>
      (() => {
        const screen = document.getElementById("screen");
        let steps = [];

        const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
        const el = (cls, text) => {
          const d = document.createElement("span");
          if (cls) d.className = cls;
          d.textContent = text;
          return d;
        };
        const nl = () => screen.appendChild(document.createTextNode("\n"));
        const toBottom = () => { screen.scrollTop = screen.scrollHeight; };

        /** Classify a real output line for colour. Never changes its text. */
        function classify(line) {
          if (/^(BLOCKED|NEW FAILURE|FAIL |husky - .* failed)/.test(line)) return "bad";
          if (/^(PASS\.|OK -)/.test(line) || /\bno regression\b/.test(line)) return "ok";
          if (/^(REGRESSION GATE|Failing )/.test(line)) return "warn";
          if (/^[─-]{10,}$/.test(line)) return "rule";
          if (/^\s+at /.test(line) || /^>/.test(line)) return "muted";
          return "";
        }

        async function typeCommand(command) {
          screen.appendChild(el("prompt", "➜"));
          screen.appendChild(document.createTextNode(" "));
          screen.appendChild(el("dir", "staging"));
          screen.appendChild(document.createTextNode(" "));
          const typed = el("cmd", "");
          screen.appendChild(typed);
          const caret = el("cursor", "");
          screen.appendChild(caret);
          for (const ch of command) {
            typed.textContent += ch;
            toBottom();
            await sleep(16);
          }
          caret.remove();
          nl();
          await sleep(260);
        }

        async function streamOutput(output) {
          const lines = output.split("\n");
          // Long outputs stream faster so no single step drags the video.
          const per = lines.length > 30 ? 26 : lines.length > 14 ? 45 : 70;
          for (const line of lines) {
            screen.appendChild(el(classify(line), line));
            nl();
            toBottom();
            await sleep(per);
          }
        }

        window.demo = {
          load(data) { steps = data.steps; },
          count() { return steps.length; },
          note(i) { return steps[i].note; },
          async play(i) {
            const s = steps[i];
            await typeCommand(s.command);
            if (s.output) await streamOutput(s.output);
            nl();
            toBottom();
            return s.exitCode;
          },
          clear() { screen.textContent = ""; },
        };
      })();
    </script>
  </body>
</html>
